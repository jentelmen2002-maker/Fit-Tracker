<style>

[hidden]{display:none!important}

<title>Fit Tracker</title>
<style>
/* Layout: one phone-width column, scrolling screen above a four-tab bar; white cards on a mint-tinted ground, one green accent */
:root{
  --bg:#EDF3EF; --surface:#FFFFFF; --surface2:#F4F8F5; --line:#DFE8E2;
  --fg:#101713; --muted:#64746A;
  --accent:#0E6B33; --accent-text:#0E6B33; --accent-bright:#1C9A4C; --accent-soft:#DDF0E3; --on-accent:#FFFFFF;
  --danger:#C93C3C; --track:#E3EBE6;
  --shadow:0 1px 2px rgba(16,40,26,.05),0 8px 20px rgba(16,40,26,.05);
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08130C; --surface:#0F1D14; --surface2:#14261A; --line:#1D3526;
    --fg:#E9F2EC; --muted:#8FA397;
    --accent:#1E9A4B; --accent-text:#4FDB8A; --accent-bright:#34C26B; --accent-soft:#12301E; --on-accent:#04140A;
    --danger:#F07878; --track:#1D3526;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08130C; --surface:#0F1D14; --surface2:#14261A; --line:#1D3526;
  --fg:#E9F2EC; --muted:#8FA397;
  --accent:#1E9A4B; --accent-text:#4FDB8A; --accent-bright:#34C26B; --accent-soft:#12301E; --on-accent:#04140A;
  --danger:#F07878; --track:#1D3526;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;margin:0;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px;border-radius:8px}
.shell{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;padding:16px}
  .shell{height:min(100%,860px);border-radius:32px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(16,40,26,.16)}
}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 24px}
.screen.enter{animation:enter .22s ease}
.screen.from-r{animation:fromR .26s ease}
.screen.from-l{animation:fromL .26s ease}
@keyframes fromR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hdr{display:flex;align-items:center;gap:4px;padding:10px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5;min-height:58px}
.hdr h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.donechk{width:72px;height:72px;border-radius:50%;margin:4px auto 0;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent-text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dtile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;text-align:left}
.dtile .v{font-size:26px;font-weight:800}.dtile .l{font-size:13px;color:var(--muted);margin-top:2px}
.dlab{position:absolute;left:10px;bottom:8px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.hdate{flex:none;align-self:flex-start;line-height:32.4px;margin-left:8px;font-size:14px;font-weight:700;white-space:nowrap;color:var(--muted)}
.hdr .name{font-size:24px;font-weight:800;letter-spacing:-.02em}
.hdr input.title-in{flex:1;min-width:0;font-size:18px;font-weight:700;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:8px 12px}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--surface)}
.txtbtn{font-weight:700;color:var(--accent-text);padding:8px 10px;border-radius:10px;flex:none}
.sub{color:var(--muted);font-size:13px}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.card h2,.h2{font-size:16px;font-weight:700;margin:0 0 10px;letter-spacing:-.005em}
.num{font-variant-numeric:tabular-nums}

.btn{height:52px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 8px 18px rgba(18,135,63,.22);text-align:center}
.btn:active{transform:scale(.99)}
.btn.o{background:var(--surface);color:var(--accent-text);border:1.5px solid var(--accent);box-shadow:none}
.btn.dis{background:var(--accent-soft);color:var(--accent-text);box-shadow:none}
.btn.danger{background:var(--surface);color:var(--danger);border:1.5px solid var(--line);box-shadow:none}
.link{color:var(--accent-text);font-weight:700;font-size:14px}

.pin{position:sticky;top:58px;z-index:4;background:var(--bg);margin:0 -16px;padding:2px 16px 8px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:600;color:var(--muted);text-align:center;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent)}

.thumb{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.thumb.lg{width:100%;height:170px;border-radius:20px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);flex:none}
.badge{font-size:12px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:3px 9px;flex:none}

.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 8px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px}
.tab.on{color:var(--accent-text)}

.ringwrap{position:relative;flex:none}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-bg{stroke:var(--track)}
.ring-fg{stroke:var(--accent-bright);transition:stroke-dashoffset .35s ease}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--on-accent)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.today{border-color:var(--accent);border-width:2px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tri .v{font-size:19px;font-weight:700;margin-top:2px}
.tri .l{font-size:12px;color:var(--muted)}
.tri .ico{color:var(--accent-text);display:flex;justify-content:center}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:23px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.tile .d{font-size:12.5px;font-weight:700;color:var(--accent-text)}
.tile .d.n{color:var(--muted)}

.lbl{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.fld{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px;min-height:48px}
.fld input{flex:1;min-width:0;border:0;background:none;font-weight:600;font-size:16px;outline:none;padding:6px 0}
.fld .suf{color:var(--muted);font-size:14px}
.sbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.sbtn:hover{background:var(--surface2);color:var(--fg)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:600;outline:none}
.inp:focus,.fld:focus-within{border-color:var(--accent)}
textarea.inp{min-height:84px;resize:vertical;font-weight:500}
.err{color:var(--danger);font-size:13px;margin-top:6px}

.sw{width:48px;height:28px;border-radius:999px;background:var(--track);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--muted)}
.chips.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible}.chips.goals .chip{height:44px;padding:0 10px;text-align:center;white-space:nowrap;font-size:15px}.chips.goals .chip:nth-child(2){grid-column:1/-1;order:3}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.exrow{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;touch-action:pan-y}
.exrow.dragging{box-shadow:0 10px 30px rgba(0,0,0,.2);border-color:var(--accent);position:relative;z-index:2}
.handle{width:34px;height:40px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pick.sel{border-color:var(--accent);background:var(--accent-soft)}
.pick .plus{margin-left:auto;color:var(--accent-text);flex:none}

.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.setchip{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted);background:var(--surface2)}
.setchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-bright);border-radius:99px;transition:width .3s}

.round{width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;text-align:center;line-height:1.15;font-size:15px}
.round small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.round.big{width:80px;height:80px;background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 10px 22px rgba(18,135,63,.3)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px;text-align:center}
.cal .h{font-size:12px;color:var(--muted);font-weight:600;padding:6px 0}
.cal button{height:38px;width:38px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cal button.log{background:var(--accent);color:var(--on-accent)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent-bright)}
.cal button.sel{box-shadow:0 0 0 3px var(--accent-soft),inset 0 0 0 2px var(--accent)}
.cal button.dim{color:var(--muted);opacity:.55}

.wslot{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.wimg{aspect-ratio:4/3;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent-text);overflow:hidden}
.wimg img{width:100%;height:100%;object-fit:cover;display:block}
.wcap b{display:block;font-size:14px}.wcap span{font-size:12px;color:var(--muted)}
.screen.flowmode{padding:0;display:flex;flex-direction:column;overflow:hidden}
.scene{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 20px 20px;background:var(--bg);animation:sceneIn .5s cubic-bezier(.2,.8,.2,1);--ping:var(--accent-bright)}
@keyframes sceneIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.scene .stop{display:flex;align-items:center;gap:10px;min-height:48px}
.scene .stop .bar{height:6px}
.scene .mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;overflow:auto}
.scene .bot{display:flex;flex-direction:column;gap:10px}
.scene .hint{text-align:center;font-size:13px;opacity:.85}
.scene.set{background:linear-gradient(165deg,#17a04f 0%,#0b5f2c 100%);color:#fff;--ping:rgba(255,255,255,.55)}
.scene.set .ibtn{color:#fff}
.scene.set .ibtn:hover{background:rgba(255,255,255,.14)}
.scene.set .bar{background:rgba(255,255,255,.28)}
.scene.set .bar i{background:#fff}
.scene.set .sub{color:rgba(255,255,255,.85)}
.pulse{position:relative;width:200px;height:200px;display:grid;place-items:center;flex:none}
.pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ping);animation:ping 2.4s ease-out infinite}
.pulse i:nth-child(2){animation-delay:1.2s}
.pulse .big{position:relative;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:72px;font-weight:800;font-variant-numeric:tabular-nums}
.pulse .big.cam{background:var(--accent-soft);color:var(--accent-text)}
@keyframes ping{from{transform:scale(.75);opacity:.9}to{transform:scale(1.4);opacity:0}}
.exn{font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
.kick{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.reps{font-size:20px;font-weight:600}
.dots{display:flex;gap:8px;justify-content:center}
.dots b{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots b.on{background:#fff}
.btn.white{background:#fff;color:#0b5f2c;box-shadow:none}
.snap{width:min(100%,250px);aspect-ratio:3/4;border-radius:22px;object-fit:cover;box-shadow:var(--shadow);display:block}
img[data-pid]:not([src]){visibility:hidden}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pimg{position:relative;display:block;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.pimg img,.pimg svg.sil{width:100%;height:100%;object-fit:cover;display:block}
.ptag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;background:var(--surface);color:var(--muted);border-radius:99px;padding:2px 8px}
.pcam{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.pcap{display:flex;flex-direction:column;margin-top:8px;gap:1px}
.pcap b{font-size:15px}.pcap span{font-size:12px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:1fr 78px 78px 64px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mrow input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-weight:600;outline:none}
.mrow .dl{font-size:13px;font-weight:700;text-align:right;color:var(--accent-text)}
.cmp{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--surface2)}
.cmp>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.range{width:100%;accent-color:var(--accent)}

.ach{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.ach .a{min-width:0;overflow-wrap:anywhere;hyphens:auto;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}
.ach .a .thumb{width:54px;height:54px;border-radius:50%}
.ach .a.lock{opacity:.45}
.kv{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted);flex:1}
.kv .v{font-variant-numeric:normal;letter-spacing:0;font-weight:600}
.avwrap{position:relative;flex:none;width:60px;height:60px;border-radius:50%}
.avcam{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--accent-text);border:1px solid var(--line);display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar{overflow:hidden;width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:26px;font-weight:800;flex:none}

.layer .backdrop{position:absolute;inset:0;background:rgba(5,15,9,.45);z-index:20;animation:fade .2s}
.layer .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 16px 20px;z-index:21;max-height:88%;overflow-y:auto;animation:up .24s ease}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px;font-weight:700}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart-t{fill:var(--muted);font-size:10px;font-family:var(--font)}
.pick.open{border-radius:14px 14px 0 0;border-bottom-color:transparent}
.cfg{background:var(--surface);border:1px solid var(--accent);border-top:0;border-radius:0 0 14px 14px;padding:4px 12px 8px}
.cfgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-weight:600;font-size:14px}
.cfgrow+.cfgrow{border-top:1px solid var(--line)}
.cfgrow .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.mini{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.mini button{width:34px;height:34px;display:grid;place-items:center;color:var(--muted);flex:none;text-align:center}
.fld input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.mini input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.mini input{width:60px;min-width:0;border:0;background:none;text-align:center;font-weight:700;outline:none}
.useg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.useg.full{width:100%}
.useg.full button{flex:1;padding:0 4px;text-align:center}
.useg button{height:28px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.useg button.on{background:var(--accent);color:var(--on-accent)}
.ringwrap .mid{white-space:nowrap}
.scene.set .ring-bg{stroke:rgba(255,255,255,.28)}
.scene.set .ring-fg{stroke:#fff}
.scene.set .round{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.scene.set .round.big{background:#fff;color:#0b5f2c;border-color:#fff}
.pick .pickmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:2px 0}
.pick .pickmain .s{font-size:12.5px;color:var(--muted);font-weight:500}
.pickchk{width:32px;height:32px;display:grid;place-items:center;flex:none;color:var(--accent-text)}
.pbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.pbtn.ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pbtn.del{color:var(--danger)}
.datechips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{width:52px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:11px;font-weight:600;text-align:center}
.dchip b{font-size:17px;color:var(--fg)}
.dchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dchip.on b{color:var(--on-accent)}
.ach .a{border-radius:12px}
.ach .a:not(.lock) .thumb{background:var(--accent);color:var(--on-accent)}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}

#splash{position:fixed;inset:0;z-index:1000;background:#0C5026;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .glow{position:absolute;width:140vmin;height:140vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.38),rgba(255,255,255,0) 62%);opacity:0;animation:sp-glow 1.6s .1s ease-out forwards}
#splash .lg{position:relative;width:min(40vw,168px);aspect-ratio:1;border-radius:22.5%;overflow:hidden;box-shadow:0 14px 40px rgba(30,60,20,.35);opacity:0;transform:scale(.55) rotate(-8deg);animation:sp-pop .85s .15s cubic-bezier(.2,1.25,.4,1) forwards}
#splash .lg img{width:100%;height:100%;display:block}
#splash .lg::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:sp-glint .8s 1s ease-in-out forwards}
#splash .ring{position:absolute;width:min(40vw,168px);aspect-ratio:1;border-radius:22.5%;border:3px solid rgba(255,255,255,.7);opacity:0;animation:sp-ring 1.2s .7s ease-out forwards}
#splash .t{margin-top:30px;font-size:26px;font-weight:800;letter-spacing:-.01em;color:#fff;opacity:0;transform:translateY(12px);animation:sp-up .6s 1s ease-out forwards}
#splash .s{margin-top:6px;font-size:14px;font-weight:600;color:rgba(255,255,255,.88);opacity:0;transform:translateY(10px);animation:sp-up .6s 1.2s ease-out forwards}
@keyframes sp-pop{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes sp-glow{0%{opacity:0;transform:scale(.4)}50%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes sp-glint{to{left:130%}}
@keyframes sp-ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes sp-up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .glow,#splash .ring,#splash .lg::after{display:none}#splash .lg,#splash .t,#splash .s{animation-duration:.01s;animation-delay:0s}}
</style>

</head>

<script>
(function(){
'use strict';
var KEY='fit-tracker-v4';
var $=function(s,r){return (r||document).querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var fromIso=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var wd=function(d){return (d.getDay()+6)%7};
var todayIso=function(){return iso(new Date())};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var sum=function(a,k){return a.reduce(function(s,x){return s+(+x[k]||0)},0)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pl=function(n,f){var a=Math.abs(n)%100,b=a%10;return f[(a>10&&a<20)?2:(b>1&&b<5)?1:(b===1)?0:2]};
var DS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var DF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var fmtDate=function(s){var d=fromIso(s);return d.getDate()+' '+MG[d.getMonth()]+' '+d.getFullYear()};
var fmtShort=function(s){var p=s.split('-');return p[2]+'.'+p[1]};
var fmtDur=function(m){var h=Math.floor(m/60);return h?h+'ч '+pad(m%60)+'м':m+'м'};
var fmtN=function(n){return Math.round(n).toLocaleString('ru-RU')};
var n1=function(n){return (Math.round(n*10)/10).toString().replace('.',',')};
var WEEK_GOAL=5,HORIZON=20;
var PH={},dbP=null;
function photoDb(){
  if(dbP)return dbP;
  dbP=new Promise(function(res,rej){try{var r=indexedDB.open('fit-tracker-photos',1);r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}});
  return dbP;
}
function putPhoto(id,src){
  PH[id]=src;
  return photoDb().then(function(d){return new Promise(function(res,rej){var tx=d.transaction('p','readwrite');tx.objectStore('p').put(src,id);tx.oncomplete=res;tx.onerror=rej})}).catch(function(){});
}
function getPhoto(id){
  if(PH[id])return Promise.resolve(PH[id]);
  return photoDb().then(function(d){return new Promise(function(res){var q=d.transaction('p').objectStore('p').get(id);q.onsuccess=function(){if(q.result)PH[id]=q.result;res(q.result||null)};q.onerror=function(){res(null)}})}).catch(function(){return null});
}
function hydrate(root){
  [].forEach.call((root||document).querySelectorAll('img[data-pid]'),function(im){
    if(im.getAttribute('src'))return;
    getPhoto(im.getAttribute('data-pid')).then(function(src){if(src)im.src=src});
  });
}
function imgp(p,alt,cls){return '<img'+(cls?' class="'+cls+'"':'')+' data-pid="'+p.id+'" alt="'+esc(alt)+'">'}
function restDisp(o){return (o.restUnit||'сек')==='мин'?String(Math.round(o.rest/60*10)/10):String(o.rest)}
function restTxt(o){return restDisp(o)+' '+(o.restUnit||'сек')}
function parseRest(v,u){var n=parseFloat(String(v).replace(',','.'));if(isNaN(n))n=0;return clamp(Math.round(u==='мин'?n*60:n),0,3600)}

  return n;
}

screens.program=function(){

function activityChart(r){

  var b=[],val=function(f,to){return S.log.filter(function(l){return l.date>=f&&l.date<=to}).reduce(function(a,l){return a+(+l[metric]||0)},0)};
  if(r==='week'){var ws=weekStart();for(var i=0;i<7;i++){var d=iso(addDays(ws,i));b.push({l:DS[i],v:val(d,d)})}}
  else if(r==='month'){for(var j=29;j>=0;j--){var dd=addDays(t,-j),di=iso(dd);b.push({l:(j%7===0)?pad(dd.getDate())+'.'+pad(dd.getMonth()+1):'',v:val(di,di)})}}
  else{
    var first=S.log.length?S.log.map(function(l){return l.date}).sort()[0]:iso(t),fd=fromIso(first);
    var ty=t.getFullYear(),tm=t.getMonth(),months=(ty-fd.getFullYear())*12+(tm-fd.getMonth())+1;
    months=Math.min(Math.max(months,6),12);
    for(var k=months-1;k>=0;k--){var md=new Date(ty,tm-k,1);b.push({l:MN[md.getMonth()].slice(0,3),v:val(iso(md),iso(new Date(md.getFullYear(),md.getMonth()+1,0)))})}
  }
  var W=320,H=170,L=32,R=8,T=16,B=24,pw=W-L-R,ph=H-T-B,n=b.length,slot=pw/n,bw=Math.max(3,Math.min(28,slot*0.62));
  var mxv=Math.max.apply(null,b.map(function(x){return x.v})),total=b.reduce(function(a,x){return a+x.v},0);
  var mx=Math.max(4,Math.ceil(mxv/4)*4),g='',bars='',xl='';
  for(var q=0;q<=4;q++){var yv=mx/4*q,y=T+ph*(1-yv/mx);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text class="chart-t" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+yv+'</text>'}
  b.forEach(function(x,ix){
    var cx=L+slot*ix+slot/2,h=ph*x.v/mx;
    if(x.v>0){bars+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(T+ph-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="var(--accent-bright)"/>';
      if(n<=7)bars+='<text class="chart-t" x="'+cx.toFixed(1)+'" y="'+(T+ph-h-4).toFixed(1)+'" text-anchor="middle" style="fill:var(--fg);font-weight:600">'+x.v+'</text>'}
    else bars+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(T+ph-2)+'" width="'+bw.toFixed(1)+'" height="2" rx="1" fill="var(--track)"/>';
    if(x.l)xl+='<text class="chart-t" x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+x.l+'</text>';

  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Активность: всего '+total+(metric==='sets'?' подходов':' минут')+'">'+g+bars+xl+'</svg></div>'+
    (total===0?'<div class="sub" style="text-align:center;margin-top:2px">За этот период тренировок нет</div>':'');

function weightChart(pts){
  if(pts.length<2)return '<div class="empty">Запишите вес хотя бы дважды, и здесь появится динамика.</div>';
  var W=320,H=176,L=34,R=12,T=12,B=26,pw=W-L-R,ph=H-T-B;
  var ks=pts.map(function(p){return p.kg}),mn=Math.floor(Math.min.apply(null,ks)-0.5),mx=Math.ceil(Math.max.apply(null,ks)+0.5);
  if(mx-mn<2)mx=mn+2;
  var t0=fromIso(pts[0].d).getTime(),t1=fromIso(pts[pts.length-1].d).getTime();
  var X=function(p){return L+(t1===t0?0.5:(fromIso(p.d).getTime()-t0)/(t1-t0))*pw};
  var Y=function(v){return T+(1-(v-mn)/(mx-mn))*ph};
  var line=pts.map(function(p,i){return (i?'L':'M')+X(p).toFixed(1)+' '+Y(p.kg).toFixed(1)}).join(' ');
  var area=line+' L'+X(pts[pts.length-1]).toFixed(1)+' '+(T+ph)+' L'+X(pts[0]).toFixed(1)+' '+(T+ph)+' Z';
  var grid='',step=(mx-mn)/4;
  for(var i=0;i<=4;i++){var v=mn+step*i,y=Y(v);grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text class="chart-t" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+(Math.round(v*10)/10)+'</text>'}
  var xl='';
  for(var j=0;j<4;j++){var tt=t0+(t1-t0)*j/3,dd=new Date(tt);xl+='<text class="chart-t" x="'+(L+pw*j/3)+'" y="'+(H-8)+'" text-anchor="'+(j===0?'start':j===3?'end':'middle')+'">'+pad(dd.getDate())+'.'+pad(dd.getMonth()+1)+'</text>'}
  var last=pts[pts.length-1];
  return '<div class="chartbox"><svg id="wsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Динамика веса: от '+pts[0].kg+' до '+last.kg+' кг">'+
    '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent-bright);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--accent-bright);stop-opacity:0"/></linearGradient></defs>'+
    grid+xl+'<path d="'+area+'" fill="url(#wg)"/><path d="'+line+'" fill="none" stroke="var(--accent-bright)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<line id="wcur" x1="0" x2="0" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>'+
    '<circle id="wdot" cx="'+X(last)+'" cy="'+Y(last.kg)+'" r="4.5" fill="var(--accent-bright)" stroke="var(--surface)" stroke-width="2"/></svg></div>'+
    '<div id="wread" class="sub num" style="text-align:center;margin-top:2px">'+n1(last.kg)+' кг · '+fmtShort(last.d)+' · проведите по графику</div>';
}

mounts.stats=function(){

/* ---------- timer ---------- */
var AC=null;
function audioCtx(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
  return AC;
}
document.addEventListener('pointerdown',function(){audioCtx()},{passive:true});
function beep(){
  try{if(navigator.vibrate)navigator.vibrate([350,120,350,120,500])}catch(e){}
  if(!S.sound)return;
  var a=audioCtx();if(!a)return;
  try{
    var t0=a.currentTime+0.02;
    [[0,0.4,880],[0.5,0.4,880],[1.0,0.6,1175]].forEach(function(q){
      var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=q[2];
      o.connect(g);g.connect(a.destination);
      var st=t0+q[0],en=st+q[1];
      g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.35,st+0.03);g.gain.setValueAtTime(0.35,en-0.06);g.gain.exponentialRampToValueAtTime(0.0001,en);
      o.start(st);o.stop(en+0.02);
    });
  }catch(e){}
}
function sessTick(){
  var s=S.session;if(!s)return;
  var n=Date.now(),l=s.lastTs||s.start||n,cap=600000;
  try{
    var d=getDay(s.dayId),cu=d&&flowSteps(d)[s.pos];
    if(U.timer&&U.timer.total)cap=Math.max(cap,U.timer.total*1000+120000);
    else if(cu&&cu.ex&&modeOf(cu.ex.reps)==='dist')cap=4*3600000;
  }catch(e){}
  s.activeMs=(s.activeMs||0)+Math.min(Math.max(0,n-l),cap);s.lastTs=n;
}
function startTimer(exId,secs){
  stopTimer();
  U.timer={exId:exId,total:secs,left:secs,running:true,endAt:Date.now()+secs*1000,iv:setInterval(tick,250)};
}
function stopTimer(){if(U.timer&&U.timer.iv)clearInterval(U.timer.iv);U.timer=null}
function tick(){
  var t=U.timer;if(!t)return;
  var left=t.running?(t.endAt-Date.now())/1000:t.left;
  if(t.running&&left<=0){
    stopTimer();beep();
    if(cur().name==='flow'&&S.session){if(S.session.active){completeSet();return}if(S.session.resting){advanceRest();return}}
    toast('Отдых закончен');
    if(cur().name==='timer')back();
    return;
  }
  if(cur().name==='timer'||cur().name==='flow'){
    var tx=$('#tmtxt');if(tx)tx.textContent=mmss(left);
    var fg=$('#ringfg');if(fg){var c=+fg.getAttribute('stroke-dasharray');fg.setAttribute('stroke-dashoffset',c*(1-clamp(left/t.total,0,1)))}
  }
}

/* ---------- workout flow ---------- */
function startDay(id){
  var d=getDay(id);if(!d||!d.exercises.length){toast('Добавьте упражнения в этот день');return}
  var t=todayIso();
  if(!S.session||S.session.dayId!==id||S.session.date!==t)S.session={date:t,dayId:id,done:{},pics:{before:null,after:null},pos:0,resting:false,start:Date.now()};
  save();go('flow');
}
function flowSteps(d){
  var st=[{t:'before'}];
  d.exercises.forEach(function(e){for(var j=0;j<e.sets;j++)st.push({t:'set',ex:e,n:j})});
  st.push({t:'after'});return st;
}
function repsLabel(r){r=String(r);return /[^\d\s–-]/.test(r)?r:r+' повторений'}
function timeSecs(e){var p=parseReps(e.reps),n=parseFloat(p.amt);if(isNaN(n))n=30;return Math.max(1,Math.round(n*(p.unit==='мин'?60:1)))}
function completeSet(){
  var s=S.session;if(!s)return;
  var d=getDay(s.dayId),st=flowSteps(d),cu=st[s.pos];if(!cu||cu.t!=='set')return;
  sessTick();stopTimer();s.active=false;
  s.done[cu.ex.id]=cu.n+1;
  var last=st[s.pos+1].t!=='set';
  if(!last&&cu.ex.rest>0){s.resting=true;startTimer(cu.ex.id,cu.ex.rest);s.restEnd=U.timer.endAt}
  else{s.pos++;s.resting=false}
  save();U.dir='from-r';render(false);
}
function advanceRest(){var s=S.session;if(!s)return;sessTick();stopTimer();s.resting=false;s.restEnd=null;s.pos++;save();U.dir='from-r';render(false)}
function flowTop(s,total,light){
  return '<div class="stop"><button class="ibtn" data-act="finish" aria-label="Выйти из тренировки">'+ic('close')+'</button><div class="grow"><div class="bar"><i style="width:'+(s.pos/(total-1)*100)+'%"></i></div></div><span class="sub num" style="min-width:52px;text-align:right">'+(s.pos+1)+' / '+total+'</span></div>';
}
screens.flow=function(){

      '<button class="round big" id="tmbtn" data-act="tpause" aria-label="Пауза или продолжить">'+ic(t.running?'pause':'play',32)+'</button>'+
      '<button class="round" data-act="tadd" data-d="15" aria-label="Плюс 15 секунд">+15<small>сек</small></button></div>'+
      '<div class="card" style="width:100%;text-align:left"><div class="sub" style="margin-bottom:6px">Следующий подход</div><div style="font-weight:700">'+esc(nx.ex.name)+'</div><div class="sub">'+esc(repsLabel(nx.ex.reps))+(nx.ex.sets>1?' · подход '+(nx.n+1)+' из '+nx.ex.sets:'')+'</div></div></div>'+
      '<div class="bot"><button class="btn o" data-act="restskip">Пропустить отдых</button></div></div>';
  }

  var kick=isTime?(+e.sets>1?'Подход '+(cu.n+1)+' из '+e.sets:'Время'):(single?'Дистанция':'Подход '+(cu.n+1)+' из '+e.sets);

    '<div class="bot">'+(isTime?'<button class="btn white" data-act="ready">'+ic('play',18)+'Готов</button>':'<button class="btn white" data-act="setdone">'+(single?'Выполнено':'Подход выполнен')+'</button>')+(nextRest?'<div class="hint">Дальше отдых '+restTxt(e)+'</div>':'')+'</div></div>';
};
function repsNum(r){
  var m=String(r==null?'':r).match(/\d+(?:[.,]\d+)?/g);
  if(!m)return 10;
  return m.reduce(function(a,x){return a+parseFloat(x.replace(',','.'))},0)/m.length;
}
function xpFor(d,s){
  var t=5;
  d.exercises.forEach(function(e){
    var n=Math.min(+s.done[e.id]||0,+e.sets||0);if(!n)return;
    var pr=parseReps(e.reps),per;
    if(pr.mode==='reps')per=1+0.3*repsNum(e.reps);
    else if(pr.mode==='time'){var sec=Math.min(timeSecs(e),900);per=1+sec/30}
    else per=1+6*(parseFloat(pr.amt)||0);
    t+=n*per;
  });
  return Math.max(1,Math.round(t));
}
function finishWorkout(){
  var s=S.session;if(!s)return;
  var d=getDay(s.dayId),sets=sessDone(s);
  if(!d||!sets){S.session=null;save();stopTimer();back();toast('Тренировка отменена');return}
  sessTick();
  var est=d.exercises.reduce(function(a,e){return a+(s.done[e.id]||0)*(45+e.rest)},0)/60;
  var min=Math.max(1,Math.round(s.activeMs?s.activeMs/60000:est));
  applyDecay();
  var n0=streakNow(),ds0=logDates(),isNew=ds0.indexOf(s.date)<0,sn=isNew?n0+1:Math.max(1,n0),mult=streakMult(sn);
  var reps=0,exN=0;d.exercises.forEach(function(e){var n=Math.min(+s.done[e.id]||0,+e.sets||0);if(!n)return;exN++;if(parseReps(e.reps).mode==='reps')reps+=Math.round(n*repsNum(e.reps))});
  var logId=uid();
  var firstToday=!S.log.some(function(l){return l.date===s.date});
  var before=rank().idx,base=xpFor(d,s),gain=firstToday?Math.max(1,Math.round(base*mult)):0;
  S.log.push({id:logId,date:s.date,dayId:d.id,name:d.name,sets:sets,reps:reps,min:min,kcal:Math.round(min*6.8),xp:gain,d:JSON.parse(JSON.stringify(s.done)),
    ex:d.exercises.filter(function(e){return (s.done[e.id]||0)>0}).map(function(e){return {name:e.name,sets:s.done[e.id],planned:e.sets,reps:e.reps}}),
    pics:{before:s.pics&&s.pics.before?s.pics.before.id:null,after:s.pics&&s.pics.after?s.pics.after.id:null}});
  S.xp+=gain;S.session=null;save();stopTimer();
  var up=rank().idx>before;
  U.stack=[{name:'home'},{name:'done',p:{id:logId,gain:gain,sn:sn,mult:mult,up:up,rep:!firstToday}}];render(false);
}
screens.done=function(p){
  var l=S.log.filter(function(x){return x.id===p.id})[0];
  if(!l)return hdr({back:true,title:'Тренировка'})+'<div class="empty">Запись не найдена</div>';
  var pc=l.pics||{},ph=function(k,label){return '<div class="pimg" style="cursor:default">'+(pc[k]?imgp({id:pc[k]},'Фото '+label.toLowerCase()+' тренировки'):'<div style="height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px">Без фото</div>')+'<span class="dlab">'+label+'</span></div>'};

  var xpl=p.rep?'Повторная тренировка за день: XP не начисляется':'+'+p.gain+' XP'+(p.sn>1?' · стрик '+p.sn+' '+pl(p.sn,['день','дня','дней'])+', '+fmtMult(p.mult):'')+(p.up?' · новое звание «'+rank().name+'»!':'');
  return hdr({back:true,title:''})+
  '<div class="col" style="gap:14px"><div style="text-align:center"><div class="donechk">'+ic('check',34)+'</div><h1 style="margin:14px 0 4px;font-size:24px;font-weight:800;white-space:normal">Тренировка завершена!</h1><div class="sub">'+esc(l.name)+'</div><div style="margin-top:8px;font-weight:700;color:var(--accent-text)">'+xpl+'</div></div>'+
  '<div class="dgrid">'+tile((l.ex||[]).length,'Упражнений')+tile(l.sets,'Подходов')+tile(l.reps||0,'Повторений')+tile(Math.floor(l.min/60)+':'+pad(l.min%60),'Время тренировки')+'</div>'+
  ((pc.before||pc.after)?'<div><h2 style="margin:6px 0 10px">Фото до/после</h2><div class="pgrid">'+ph('before','До')+ph('after','После')+'</div></div>':'')+

function parseReps(r){
  r=String(r==null?'':r);
  var m=r.match(/^\s*(\d+(?:[.,]\d+)?)\s*(сек|мин|км)\s*$/);
  if(m)return m[2]==='км'?{mode:'dist',amt:m[1].replace(',','.'),unit:'км'}:{mode:'time',amt:m[1].replace(',','.'),unit:m[2]};
  return {mode:'reps',amt:'',unit:''};
}

  var p=S.presets&&S.presets[v];
  if(p){
    var pp=parseReps(p.reps);
    cf.mode=pp.mode;cf.sets=p.sets;cf.rest=p.rest;cf.restUnit=p.restUnit||'сек';cf.fromPreset=true;
    if(pp.mode==='reps')cf.reps=p.reps;else{cf.amt=pp.amt;cf.tunit=pp.unit==='км'?'мин':pp.unit}
  }
  a.cfg[v]=cf;
}
function cfgDef(c){
  var d=c.def,m=c.mode,same=d.mode===m;
  if(m==='reps')return {sets:same?d.sets:3,reps:same?d.reps:'10'};
  if(m==='time')return {sets:same?d.sets:1,amt:same?d.amt:'20',unit:same?d.unit:'мин'};
  return {sets:same?d.sets:1,amt:same?d.amt:'5',unit:'км'};

function cfgReps(c){
  var dd=cfgDef(c);
  if(c.mode==='reps')return (String(c.reps).trim()!==''&&/\d/.test(String(c.reps)))?c.reps:dd.reps;
  var n=parseFloat(String(c.amt).replace(',','.'));if(isNaN(n)||n<=0)n=parseFloat(dd.amt);

(function(){

    var t=e.touches[0],n=U.stack[U.stack.length-1].name;x0=t.clientX;y0=t.clientY;tt=Date.now();

  },{passive:true});

    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(dx<70||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-tt>700)return;

  ly.addEventListener('touchstart',function(e){
    var el=e.target.closest('.sheet');sk=!!el&&el.scrollTop<=0&&e.touches.length===1&&!e.target.closest('input,textarea');
    sh=sk?el:null;sy=e.touches[0].clientY;dy=0;if(sh)sh.style.transition='none';
  },{passive:true});

/* drag to reorder */
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest('[data-drag]');if(!h)return;
  var row=h.closest('.exrow'),list=row.parentElement;e.preventDefault();
  row.classList.add('dragging');
  try{h.setPointerCapture(e.pointerId)}catch(_){}
  function mv(ev){
    var y=ev.clientY,sibs=[].slice.call(list.children);
    for(var i=0;i<sibs.length;i++){
      var s=sibs[i];if(s===row)continue;
      var r=s.getBoundingClientRect();
      if(y>r.top&&y<r.bottom){if(y<r.top+r.height/2)list.insertBefore(row,s);else list.insertBefore(row,s.nextSibling);break}
    }
  }
  function up(){
    h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
    row.classList.remove('dragging');
    var ids=[].map.call(list.children,function(x){return x.dataset.ex}),d=getDay(list.dataset.day);
    if(d){d.exercises.sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id)});save()}
  }
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});

    }

}

(function(){

/* ---------- проверка обновлений (только в APK, нужен интернет) ---------- */
var FT_BUILD=0;var FT_REPO='';
(function(){
  var K='fit-update-v1',url='';
  function rd(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}}
  function wr(o){try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}}
  function msg(m,manual){if(manual)toast(m)}
  function check(manual,force){
    if(!NATIVE){msg('Проверка работает только в установленном приложении',manual);return}
    if(!(FT_BUILD>0)||!FT_REPO){msg('Эта сборка без номера: обновления не проверяются',manual);return}
    if(navigator.onLine===false||typeof fetch!=='function'){msg('Нет интернета',manual);return}
    var st=rd(),now=Date.now();
    if(!manual&&!force&&st.at&&now-st.at<6*3600*1000)return;
    var ctl=window.AbortController?new AbortController():null;var to=setTimeout(function(){if(ctl)ctl.abort()},8000);
    if(manual)toast('Проверяю…');
    fetch('https://api.github.com/repos/'+FT_REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'},signal:ctl?ctl.signal:undefined})
      .then(function(r){
        clearTimeout(to);
        if(!r.ok){msg(r.status===404?'Релизы не найдены: репозиторий приватный или релиза ещё нет':'GitHub ответил ошибкой '+r.status,manual);return null}
        return r.json();
      }).then(function(j){
        if(!j)return;
        var cur=rd();cur.at=Date.now();wr(cur);
        if(!j.tag_name){msg('Не удалось прочитать версию релиза',manual);return}
        var m=/(\d+)\s*$/.exec(j.tag_name),n=m?+m[1]:0;
        if(!(n>FT_BUILD)){msg('Установлена последняя версия (сборка '+FT_BUILD+')',manual);return}
        if(!manual&&cur.skip===n)return;
        var a=(j.assets||[]).filter(function(x){return /\.apk$/i.test(x.name||'')})[0];
        url=a?a.browser_download_url:(j.html_url||'https://github.com/'+FT_REPO+'/releases/latest');
        if(!manual){if(S.session&&S.session.active)return;if($('#layer').firstChild)return}
        sheet('<h3>Доступно обновление</h3><div class="sub" style="margin-bottom:14px">Вышла новая версия приложения (сборка '+n+', у вас '+FT_BUILD+'). Ваши данные сохранятся. После скачивания откройте файл и подтвердите установку.</div><div class="col" style="gap:8px"><button class="btn" data-act="updgo">Скачать обновление</button><button class="btn o" data-act="updlater" data-n="'+n+'">Позже</button></div>');
      }).catch(function(){clearTimeout(to);msg('Не удалось связаться с GitHub. Проверьте интернет',manual)});
  }
  A.updcheck=function(){closeSheet();check(true)};
  A.updgo=function(){closeSheet();render(true);try{window.open(url,'_blank')}catch(e){location.href=url}};
  A.updlater=function(el){var n=+(el&&el.dataset&&el.dataset.n)||0;var st=rd();st.skip=n;wr(st);closeSheet();render(true)};
  setTimeout(function(){check(false,true)},4000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(function(){check(false)},1500)});
  window.addEventListener('online',function(){setTimeout(function(){check(false)},1500)});
})();
})();
