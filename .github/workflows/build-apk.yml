name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK (steps are in app/ci/build.sh)
        run: bash app/ci/build.sh

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fit-tracker-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fit Tracker, сборка ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
