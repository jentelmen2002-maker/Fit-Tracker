name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android manifest (camera, vibration, portrait only)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          grep -n "screenOrientation\|CAMERA\|VIBRATE" $M

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#A2BA7E' --iconBackgroundColorDark '#A2BA7E' --splashBackgroundColor '#A2BA7E' --splashBackgroundColorDark '#A2BA7E'

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fit-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fit Tracker, сборка ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
