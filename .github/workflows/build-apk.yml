name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android manifest (camera, vibration, portrait only)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          grep -n "screenOrientation\|CAMERA\|VIBRATE" $M

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#D6F2AB' --iconBackgroundColorDark '#D6F2AB' --splashBackgroundColor '#D6F2AB' --splashBackgroundColorDark '#D6F2AB'

      - name: Remove system splash logo (only the animated start screen stays)
        run: |
          R=android/app/src/main/res
          cat > $R/drawable/splash_icon_empty.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#00000000" />
              <size android:width="1dp" android:height="1dp" />
          </shape>
          EOF
          sed -i 's|<item name="android:background">@drawable/splash</item>|<item name="android:background">@drawable/splash</item>\n        <item name="windowSplashScreenBackground">#D6F2AB</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon_empty</item>|' $R/values/styles.xml
          cat $R/values/styles.xml

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fit-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fit Tracker, сборка ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
